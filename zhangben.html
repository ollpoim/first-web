<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>小组记账</title>
    <style>
        body{
            background-color: #ececec;
        }
        h1{
            color:#222;
            text-align:center;
        }
        .box{
            background-color:white;
            margin:15px 18px;
            padding:12px;
        }
        h2{
            color:#333;
        }
        input, select{
            border:1px solid #999;
        }
        button{
            background-color:#3e74b3;
            color: white;
            border:none;
        }
        table{
            width:100%;
            border:1px solid #bbb;
        }
        th,td{
            border:1px solid #bbb;
            text-align:center;
        }
        th{
            background-color:#e7e7e7;
        }
        .green{
            color:#007020;
        }
        .red{
            color:#c82423;
        }
    </style>
</head>
<body>
    <h1>小组记账本</h1>

    <div class="box">
        <h2>本月统计</h2>
        <p>总收入：<span id="shouru">0</span> 元</p >
        <p>总支出：<span id="zhichu">0</span> 元</p >
        <p>结余：<span id="jieyu">0</span> 元</p >
    </div>

    <div class="box">
        <h2>添加记录</h2>
        <p>日期：<input type="date"></p >
        <p>项目：<input type="text" placeholder="比如吃饭"></p >
        <p>类型：
            <select>
                <option>支出</option>
                <option>收入</option>
            </select>
        </p >
        <p>金额：<input type="number"></p >
        <p><button>保存</button></p >
    </div>

    <div class="box">
        <h2>记录列表</h2>
        <table>
            <tr>
                <th>日期</th>
                <th>事项</th>
                <th>类型</th>
                <th>金额</th>
            </tr>
            <tr>
                <td>10-03</td>
                <td>超市</td>
                <td class="red">支出</td>
                <td>95</td>
            </tr>
            <tr>
                <td>10-07</td>
                <td>家教</td>
                <td class="green">收入</td>
                <td>400</td>
            </tr>
            <tr>
                <td>10-10</td>
                <td>奶茶</td>
                <td class="red">支出</td>
                <td>32</td>
            </tr>
        </table>
    </div>

<script>
// 把记账记录存在浏览器本地
let jizhangList = localStorage.getItem("jizhang");
if (jizhangList == null) {
    jizhangList = [];
} else {
    jizhangList = JSON.parse(jizhangList);
}

// 获取保存按钮
let baocunBtn = document.querySelector("button");
baocunBtn.onclick = function () {

    // 取出各个输入框的值
    let riqi = document.querySelector('input[type="date"]').value;
    let xiangmu = document.querySelector('input[type="text"]').value;
    let leixing = document.querySelector('select').value;
    let jine = document.querySelector('input[type="number"]').value;

    // 简单判断，不能为空
    if (riqi == "" || xiangmu == "" || jine == "") {
        alert("日期、项目、金额都要填哦！");
        return;
    }

    // 新建一条记录
    let newItem = {
        date: riqi,
        name: xiangmu,
        type: leixing,
        money: jine
    };
    jizhangList.push(newItem);

    // 保存到浏览器
    localStorage.setItem("jizhang", JSON.stringify(jizhangList));

    // 在表格末尾加一行
    let biaoGe = document.querySelector("table");
    let hang = document.createElement("tr");

    let yanSeLei;
    if (leixing == "收入") {
        yanSeLei = "green";
    } else {
        yanSeLei = "red";
    }

    hang.innerHTML = "<td>" + riqi + "</td>"
        + "<td>" + xiangmu + "</td>"
        + "<td class='" + yanSeLei + "'>" + leixing + "</td>"
        + "<td>" + jine + "</td>";

    biaoGe.appendChild(hang);

    // 清空输入框
    document.querySelector('input[type="date"]').value = "";
    document.querySelector('input[type="text"]').value = "";
    document.querySelector('input[type="number"]').value = "";

    // 更新统计数字
    suanZongShu();
};

// 计算总收入、总支出
function suanZongShu() {
    let sumShou = 0;
    let sumZhi = 0;
    for (let i = 0; i < jizhangList.length; i++) {
        let one = jizhangList[i];
        if (one.type == "收入") {
            sumShou = sumShou + Number(one.money);
        } else {
            sumZhi = sumZhi + Number(one.money);
        }
    }
    document.getElementById("shouru").innerText = sumShou;
    document.getElementById("zhichu").innerText = sumZhi;
    document.getElementById("jieyu").innerText = sumShou - sumZhi;
}

// 页面打开时，把之前存的记录显示出来
for (let i = 0; i < jizhangList.length; i++) {
    let one = jizhangList[i];
    let hang = document.createElement("tr");
    let yanSeLei;
    if (one.type == "收入") {
        yanSeLei = "green";
    } else {
        yanSeLei = "red";
    }
    hang.innerHTML = "<td>" + one.date + "</td>"
        + "<td>" + one.name + "</td>"
        + "<td class='" + yanSeLei + "'>" + one.type + "</td>"
        + "<td>" + one.money + "</td>";
    document.querySelector("table").appendChild(hang);
}

// 打开页面就算一遍统计
suanZongShu();
</script>

</body>
</html>
